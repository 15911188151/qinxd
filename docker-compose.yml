version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:14-alpine
    container_name: drama_postgres
    environment:
      POSTGRES_USER: drama_user
      POSTGRES_PASSWORD: drama_pass
      POSTGRES_DB: drama_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - drama_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drama_user -d drama_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis缓存和消息队列
  redis:
    image: redis:7-alpine
    container_name: drama_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - drama_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Java后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drama_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/drama_db
      SPRING_DATASOURCE_USERNAME: drama_user
      SPRING_DATASOURCE_PASSWORD: drama_pass
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JAVA_OPTS: -Xmx512m -Xms256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - drama_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: drama_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - drama_network
    environment:
      REACT_APP_API_URL: http://backend:8080

volumes:
  postgres_data:
  redis_data:

networks:
  drama_network:
    driver: bridge
